<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>FF14 レシピツール ランチャー</title>
<style>
  body {
    background: #1a1a1a;
    color: #e0e0e0;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    gap: 16px;
  }
  h1 { font-size: 15px; color: #c8a84b; }
  button {
    background: #252525;
    border: 1px solid #c8a84b;
    color: #c8a84b;
    padding: 10px 28px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #2a2a1a; }
  p { font-size: 12px; color: #888; }
</style>
</head>
<body>
<h1>FF14 レシピ素材ツリー</h1>
<button onclick="launch()">起動</button>
<p>※起動後はこのウィンドウを閉じてOKです</p>
<script>
function launch() {
  const url = 'https://jogu6.github.io/ff14-recipe/';
  const w = 520;
  const h = 700;
  const left = Math.round((screen.width - w) / 2);
  const top  = Math.round((screen.height - h) / 2);
  window.open(url, 'ff14recipe',
    `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no`
  );
}
</script>
</body>
</html>
