<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FF14レシピ素材ツリー アイテム情報作成</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div class="app-title">
      <img class="app-title-icon" src="./assets/favicon.png" alt="">
      <h1 id="appTitle"></h1>
    </div>
    <span id="statusText">読み込み中...</span>
  </header>

  <main>
    <aside class="side-panel">
      <section class="panel-section collapsible-section">
        <button id="csvToggle" class="section-toggle" type="button" aria-expanded="true">
          <span class="section-toggle-mark" aria-hidden="true">▼</span>
          <span id="csvToggleLabel"></span>
        </button>
        <div id="csvBody" class="collapsible-body">
        <div class="action-item" data-step="check-updates">
          <span class="order-label"></span>
          <button id="checkUpdatesBtn" type="button"></button>
          <p></p>
          <span class="action-status">○ 未実行</span>
        </div>
        <dl class="meta-list">
          <div><dt>前回チェック</dt><dd id="lastChecked">-</dd></div>
        </dl>
        <div class="action-item" data-step="download-csv">
          <span class="order-label"></span>
          <button id="downloadCsvBtn" type="button"></button>
          <p></p>
          <span class="action-status">○ 未実行</span>
        </div>
        <div class="action-item" data-step="validate-csv">
          <span class="order-label"></span>
          <button id="validateCsvBtn" type="button"></button>
          <p></p>
          <span class="action-status">○ 未実行</span>
        </div>
        <div class="action-item" data-step="build">
          <span class="order-label"></span>
          <button id="buildBtn" type="button"></button>
          <p></p>
          <span class="action-status">○ 未実行</span>
        </div>
        <div class="action-item" data-step="publish-lodestone-info">
          <span class="order-label"></span>
          <button id="lodestoneInfoBtn" type="button"></button>
          <label class="field quality-field">
            <span>アクセス間隔(ms)</span>
            <input id="lodestoneDelayInput" type="number" min="0" max="60000" step="100" value="100">
          </label>
          <label class="field quality-field">
            <span>強制再取得</span>
            <input id="lodestoneForceInput" type="checkbox">
          </label>
          <p></p>
          <span class="action-status">○ 未実行</span>
        </div>
        <div class="action-item" data-step="equipment-role-groups">
          <span class="order-label"></span>
          <button id="equipmentRoleBtn" type="button"></button>
          <p></p>
          <span class="action-status">○ 未実行</span>
          <span id="equipmentRoleCount" class="equipment-role-count">指定状況を読み込み中...</span>
        </div>
        <div class="action-item" data-step="publish">
          <span class="order-label"></span>
          <button id="publishBtn" type="button"></button>
          <p></p>
          <span class="action-status">○ 未実行</span>
        </div>
        <div class="action-item" data-action-id="run-all">
          <span class="order-label"></span>
          <button id="runBtn" type="button"></button>
          <p></p>
        </div>
        </div>
      </section>

      <section class="panel-section collapsible-section">
        <button id="buildToggle" class="section-toggle" type="button" aria-expanded="false">
          <span class="section-toggle-mark" aria-hidden="true">▶</span>
          <span id="buildToggleLabel"></span>
        </button>
        <div id="buildBody" class="collapsible-body" hidden>
        <div class="action-item" data-step="icons">
          <span class="order-label"></span>
          <button id="iconsBtn" type="button"></button>
          <label class="field quality-field">
            <span>Quality</span>
            <input id="qualityInput" type="number" min="1" max="100" step="1" value="80">
          </label>
          <label class="field quality-field">
            <span>生成サイズ(px)</span>
            <input id="iconSizeInput" type="number" min="1" max="512" step="1" value="80">
          </label>
          <label class="field quality-field">
            <span>アクセス間隔(ms)</span>
            <input id="iconDelayInput" type="number" min="0" max="60000" step="100" value="500">
          </label>
          <p></p>
          <span class="action-status">○ 未実行</span>
        </div>
        <div class="action-item" data-step="verify">
          <span class="order-label"></span>
          <button id="verifyBtn" type="button"></button>
          <p></p>
          <span class="action-status">○ 未実行</span>
        </div>
        </div>
      </section>

      <section class="panel-section collapsible-section">
        <button id="iconQualityToggle" class="section-toggle" type="button" aria-expanded="false">
          <span class="section-toggle-mark" aria-hidden="true">▶</span>
          <span id="iconQualityToggleLabel"></span>
        </button>
        <div id="iconQualityBody" class="collapsible-body" hidden>
        <div class="action-item" data-step="tmp-quality-preview">
          <span class="order-label"></span>
          <button id="previewBtn" type="button"></button>
          <label class="field quality-field">
            <span>プレビュー生成サイズ(px)</span>
            <input id="previewSizeInput" type="number" min="1" max="512" step="1" value="80">
          </label>
          <p></p>
          <span class="action-status">○ 未実行</span>
        </div>
        </div>
      </section>
    </aside>

    <section class="work-panel">
      <div class="progress-area">
        <div class="progress-header">
          <strong id="progressTitle"></strong>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>
        <div class="progress-details">
          <span id="progressDetail"></span>
          <span id="etaText">ETA -</span>
        </div>
        <div id="progressActions" class="progress-actions" hidden>
          <button id="cancelBtn" type="button"></button>
          <button id="resumeBtn" type="button"></button>
        </div>
      </div>

      <section class="log-panel">
        <div class="log-header">
          <h2>Log</h2>
          <button id="clearLogBtn" type="button"></button>
        </div>
        <div id="log" class="log-view" role="log" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <div id="previewOverlay" class="preview-overlay" aria-hidden="true">
    <section class="preview-modal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <header class="preview-header">
        <h2 id="previewTitle"></h2>
        <div class="preview-tools">
          <button id="previewScale2" type="button">2x</button>
          <button id="previewScale3" type="button">3x</button>
          <button id="previewThemeBtn" type="button">light</button>
          <button id="previewCloseBtn" type="button"></button>
        </div>
      </header>
      <main id="previewContent" class="preview-content"></main>
    </section>
  </div>

  <div id="confirmOverlay" class="modal-overlay confirm-overlay" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">確認</h2>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="confirmOkBtn" class="primary" type="button"></button>
        <button id="confirmCancelBtn" type="button"></button>
      </div>
    </section>
  </div>

  <div id="equipmentRoleOverlay" class="modal-overlay equipment-role-overlay" aria-hidden="true">
    <section class="modal equipment-role-modal" role="dialog" aria-modal="true" aria-labelledby="equipmentRoleTitle">
      <header class="equipment-role-header">
        <div>
          <h2 id="equipmentRoleTitle"></h2>
          <p id="equipmentRoleSummary">読み込み中...</p>
        </div>
        <button id="equipmentRoleCloseBtn" type="button"></button>
      </header>
      <div id="equipmentRoleList" class="equipment-role-list"></div>
      <div class="modal-actions">
        <button id="equipmentRoleSaveBtn" class="primary" type="button"></button>
      </div>
    </section>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
