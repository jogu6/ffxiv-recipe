<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinalFantasy XIV® Crafting Assistant XIVca(シヴカ) アイテム情報作成</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div class="app-title">
      <img class="app-title-icon" src="./assets/favicon.png" alt="">
      <h1 id="appTitle"></h1>
    </div>
    <span id="statusText">読み込み中...</span>
  </header>

  <main>
    <aside id="configurationPanel" class="side-panel" aria-label="パイプライン設定">
      <label id="moduleSelectorField" class="field module-selector" hidden>
        <span>モジュール</span>
        <select id="moduleSelector"></select>
      </label>
      <section id="moduleSummary" class="module-summary"></section>
      <div id="settingsRoot" class="settings-root"></div>
      <div class="settings-tools">
        <button id="resetSettingsBtn" type="button"></button>
      </div>
      <div id="settingsErrors" class="settings-errors" role="alert" hidden></div>
      <div id="actionsRoot" class="actions-root"></div>
    </aside>

    <section class="work-panel">
      <div class="progress-area">
        <div class="progress-header">
          <strong id="progressTitle"></strong>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>
        <div class="progress-details">
          <span id="progressDetail"></span>
          <span id="etaText">ETA -</span>
        </div>
        <div id="progressActions" class="progress-actions" hidden>
          <button id="cancelBtn" type="button"></button>
          <button id="resumeBtn" type="button"></button>
        </div>
      </div>

      <section class="log-panel">
        <div class="log-header">
          <h2>Log</h2>
          <button id="openLogFolderBtn" type="button">保存先を開く</button>
          <button id="clearLogBtn" type="button"></button>
        </div>
        <div id="log" class="log-view" role="log" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <div id="previewOverlay" class="preview-overlay" aria-hidden="true">
    <section class="preview-modal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <header class="preview-header">
        <h2 id="previewTitle"></h2>
        <div class="preview-tools">
          <button id="previewScale2" type="button">2x</button>
          <button id="previewScale3" type="button">3x</button>
          <button id="previewThemeBtn" type="button">背景切替</button>
          <button id="previewCloseBtn" type="button"></button>
        </div>
      </header>
      <main id="previewContent" class="preview-content"></main>
    </section>
  </div>

  <div id="confirmOverlay" class="modal-overlay confirm-overlay" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">確認</h2>
      <p id="confirmMessage"></p>
      <div class="modal-actions">
        <button id="confirmOkBtn" class="primary" type="button"></button>
        <button id="confirmCancelBtn" type="button"></button>
      </div>
    </section>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
