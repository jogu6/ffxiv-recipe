<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF14 レシピ素材ツリー</title>
<style>
  :root {
    --bg: #1a1a1a;
    --surface: #252525;
    --border: #3a3a3a;
    --accent: #c8a84b;
    --text: #e0e0e0;
    --muted: #888;
    --surplus: #6abf69;
    --craft: #c8a84b;
    --gather: #5b9bd5;
    --hunt: #d57b5b;
    --buy: #9b7fd5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 {
    font-size: 15px;
    color: var(--accent);
    font-weight: bold;
    white-space: nowrap;
  }
  .file-area {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .file-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  .file-btn:hover { border-color: var(--accent); }
  #fileStatus { font-size: 12px; color: var(--muted); }

  .main {
    display: flex;
    height: calc(100vh - 45px);
  }

  /* 左パネル：レシピ選択 */
  .panel-left {
    width: 220px;
    min-width: 180px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }
  .panel-left-header {
    padding: 8px 10px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #searchBox {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 7px;
    border-radius: 3px;
    font-size: 12px;
    width: 100%;
  }
  #searchBox:focus { outline: none; border-color: var(--accent); }
  #recipeList {
    flex: 1;
    overflow-y: auto;
    list-style: none;
  }
  #recipeList li {
    padding: 7px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #recipeList li:hover { background: #2e2e2e; }
  #recipeList li.selected { background: #2a2a1a; color: var(--accent); }

  /* 右パネル：結果 */
  .panel-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .result-header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    flex-wrap: wrap;
  }
  .result-header label { font-size: 12px; color: var(--muted); }
  #countInput {
    width: 60px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 7px;
    border-radius: 3px;
    font-size: 13px;
    text-align: right;
  }
  #countInput:focus { outline: none; border-color: var(--accent); }
  #resultTitle {
    font-size: 13px;
    color: var(--accent);
    margin-left: auto;
  }

  #treeContainer {
    flex: 1;
    overflow: auto;
    padding: 10px 14px;
  }

  /* ツリー */
  .tree-node { line-height: 1.7; }
  .tree-node .node-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    cursor: pointer;
    padding: 1px 4px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .tree-node .node-row:hover { background: #2e2e2e; }
  .toggle { font-size: 11px; color: var(--muted); width: 12px; display: inline-block; text-align: center; }
  .node-name { font-size: 14px; }
  .node-qty { font-size: 13px; color: var(--accent); }
  .node-surplus { font-size: 12px; color: var(--surplus); }
  .badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    font-weight: bold;
  }
  .badge-craft  { background: #3a2e10; color: var(--craft); }
  .badge-gather { background: #102030; color: var(--gather); }
  .badge-hunt   { background: #301010; color: var(--hunt); }
  .badge-buy    { background: #201030; color: var(--buy); }

  .node-children { padding-left: 20px; }
  .node-children.collapsed { display: none; }

  /* スクロールバー */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  .empty-msg { color: var(--muted); font-size: 13px; padding: 20px; }
</style>
</head>
<body>

<header>
  <h1>FF14 レシピ素材ツリー</h1>
  <div class="file-area">
    <button class="file-btn" onclick="document.getElementById('fileInput').click()">📂 CSVフォルダを読み込む</button>
    <input type="file" id="fileInput" multiple accept=".csv" style="display:none" onchange="loadFiles(this.files)">
    <span id="fileStatus">CSVファイルを選択してください</span>
  </div>
</header>

<div class="main">
  <div class="panel-left">
    <div class="panel-left-header">
      <input type="text" id="searchBox" placeholder="絞り込み..." oninput="filterList()">
    </div>
    <ul id="recipeList"></ul>
  </div>
  <div class="panel-right">
    <div class="result-header">
      <label>個数:</label>
      <input type="number" id="countInput" value="1" min="1" oninput="renderTree()">
      <span id="resultTitle"></span>
    </div>
    <div id="treeContainer">
      <div class="empty-msg">左のリストからレシピを選択してください</div>
    </div>
  </div>
</div>

<script>
// ---- データストア ----
let itemMaster = {};   // name -> { type, method }
let recipes = {};      // name -> { yield, ingredients: [{name, qty}] }
let recipeNames = [];  // クラフト可能なアイテム名リスト
let selectedRecipe = null;

// ---- ファイル読み込み ----
function loadFiles(files) {
  itemMaster = {};
  recipes = {};
  recipeNames = [];
  selectedRecipe = null;

  const readers = Array.from(files).map(file => new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => resolve({ name: file.name, text: e.target.result });
    reader.readAsText(file, 'UTF-8');
  }));

  Promise.all(readers).then(results => {
    // アイテムマスター先読み
    const masterFile = results.find(r => r.name === 'アイテムマスター.csv');
    if (!masterFile) {
      alert('アイテムマスター.csv が見つかりません');
      return;
    }
    parseMaster(masterFile.text);

    // レシピCSV読み込み
    results.forEach(r => {
      if (r.name === 'アイテムマスター.csv') return;
      const itemName = r.name.replace(/\.csv$/i, '');
      parseRecipe(itemName, r.text);
    });

    // クラフト可能リスト構築
    recipeNames = Object.entries(itemMaster)
      .filter(([, v]) => v.type === 'アイテム' || v.type === '中間素材')
      .map(([k]) => k)
      .sort();

    document.getElementById('fileStatus').textContent =
      `${Object.keys(itemMaster).length}アイテム / ${Object.keys(recipes).length}レシピ 読み込み済み`;

    renderList(recipeNames);
  });
}

function parseMaster(text) {
  text.split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const cols = line.split(',');
    if (cols.length >= 3) {
      itemMaster[cols[0].trim()] = { type: cols[1].trim(), method: cols[2].trim() };
    }
  });
}

function parseRecipe(name, text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return;
  const yieldQty = parseInt(lines[0].trim(), 10) || 1;
  const ingredients = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',');
    if (cols.length >= 2) {
      ingredients.push({ name: cols[0].trim(), qty: parseInt(cols[1].trim(), 10) || 1 });
    }
  }
  recipes[name] = { yield: yieldQty, ingredients };
}

// ---- リスト表示 ----
function renderList(names) {
  const ul = document.getElementById('recipeList');
  ul.innerHTML = '';
  names.forEach(name => {
    const li = document.createElement('li');
    li.textContent = name;
    li.title = name;
    li.onclick = () => selectRecipe(name, li);
    ul.appendChild(li);
  });
}

function filterList() {
  const q = document.getElementById('searchBox').value.trim();
  const filtered = q ? recipeNames.filter(n => n.includes(q)) : recipeNames;
  renderList(filtered);
}

function selectRecipe(name, li) {
  document.querySelectorAll('#recipeList li').forEach(el => el.classList.remove('selected'));
  li.classList.add('selected');
  selectedRecipe = name;
  renderTree();
}

// ---- ツリー描画 ----
function renderTree() {
  const container = document.getElementById('treeContainer');
  const count = parseInt(document.getElementById('countInput').value, 10) || 1;
  if (!selectedRecipe) return;

  document.getElementById('resultTitle').textContent =
    `【${selectedRecipe} × ${count}個分】`;

  // 生産数計算（端数繰り上げ）
  const producedQty = calcProduced(selectedRecipe, count);
  const node = buildNode(selectedRecipe, count, producedQty, 0);
  container.innerHTML = '';
  container.appendChild(node);
}

function calcProduced(name, needed) {
  const r = recipes[name];
  if (!r) return needed;
  return r.yield * Math.ceil(needed / r.yield);
}

function buildNode(name, neededQty, producedQty, depth) {
  const master = itemMaster[name] || { type: '素材', method: '' };
  const surplus = producedQty - neededQty;
  const hasChildren = !!recipes[name];

  const div = document.createElement('div');
  div.className = 'tree-node';

  const row = document.createElement('div');
  row.className = 'node-row';

  // 展開トグル
  const toggle = document.createElement('span');
  toggle.className = 'toggle';
  toggle.textContent = hasChildren ? '▼' : '　';

  // バッジ
  const badge = document.createElement('span');
  badge.className = 'badge ' + methodBadgeClass(master.method);
  badge.textContent = master.method || master.type;

  // 名前
  const nameEl = document.createElement('span');
  nameEl.className = 'node-name';
  nameEl.textContent = name;

  // 数量
  const qtyEl = document.createElement('span');
  qtyEl.className = 'node-qty';
  qtyEl.textContent = `× ${producedQty}`;

  // 余剰
  const surplusEl = document.createElement('span');
  surplusEl.className = 'node-surplus';
  if (surplus > 0) surplusEl.textContent = `(${surplus}個余剰)`;

  row.append(toggle, badge, nameEl, qtyEl, surplusEl);
  div.appendChild(row);

  // 子ノード
  if (hasChildren) {
    const children = document.createElement('div');
    children.className = 'node-children';

    const r = recipes[name];
    r.ingredients.forEach(ing => {
      const subNeeded = ing.qty * Math.ceil(producedQty / r.yield);
      const subProduced = calcProduced(ing.name, subNeeded);
      children.appendChild(buildNode(ing.name, subNeeded, subProduced, depth + 1));
    });

    div.appendChild(children);

    // トグルクリック
    row.onclick = () => {
      const collapsed = children.classList.toggle('collapsed');
      toggle.textContent = collapsed ? '▶' : '▼';
    };
  }

  return div;
}

function methodBadgeClass(method) {
  if (!method) return 'badge-gather';
  if (method.includes('クラフト')) return 'badge-craft';
  if (method.includes('ギャザ')) return 'badge-gather';
  if (method.includes('狩猟') || method.includes('討伐')) return 'badge-hunt';
  return 'badge-buy';
}
</script>
</body>
</html>
