[package]
name = "ffxiv-recipe-pipeline"
version = "1.0.0"
description = "FFXIV Recipe pipeline GUI"
edition = "2021"

[[bin]]
name = "makeRecipe"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 16
lto = false
opt-level = 2
panic = "abort"
strip = "symbols"

[profile.release.package.ffxiv-recipe-pipeline]
codegen-units = 64
incremental = true
opt-level = 1
