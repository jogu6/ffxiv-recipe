# Modified by XIVca: package metadata and dependency versions are fixed for bundled reproducible builds.
[package]
name = "raphael-solver"
version = "0.28.6-xivca.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
raphael-sim = { workspace = true }
rustc-hash = "=2.1.1"
bitfield-struct = "=0.12.1"
rayon = { workspace = true }
log = { workspace = true }
serde = { workspace = true, optional = true }
web-time = { workspace = true }
wide = "=0.8.2"
nunny = "=0.2.2"
strum = "=0.27.2"
smallvec = { version = "=1.15.1", features = ["const_generics", "union"] }
bump-scope = "=2.2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[features]
serde = ["dep:serde", "raphael-sim/serde"]

[dev-dependencies]
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
rand = "0.9.2"
env_logger = "0.11.8"
expect-test = "1.5.1"
test-case = "3.3.1"
