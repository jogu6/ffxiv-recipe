[package]
name = "xivca-macro-engine"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
raphael-sim = { workspace = true }
raphael-solver = { path = "../vendor/raphael-solver" }
