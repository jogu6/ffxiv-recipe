<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF14 レシピ素材ツリー</title>
<link rel="icon" href="./favicon.png" type="image/png">
<link rel="apple-touch-icon" href="./favicon.png">
<style>
  :root {
    --bg: #1a1a1a;
    --surface: #252525;
    --border: #3a3a3a;
    --accent: #c8a84b;
    --text: #e0e0e0;
    --muted: #888;
    --surplus: #6abf69;
    --craft: #c8a84b;
    --gather: #5b9bd5;
    --hunt: #d57b5b;
    --buy: #9b7fd5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; color: var(--accent); font-weight: bold; white-space: nowrap; }
  #loadStatus { font-size: 12px; color: var(--muted); }
  #popupBtn {
    margin-left: auto;
    background: #252525;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  #popupBtn:hover { background: #2a2a1a; }

  .main {
    display: flex;
    height: calc(100vh - 45px);
  }
  .panel-left {
    width: 220px;
    min-width: 160px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
  }
  .panel-left-header {
    padding: 8px 10px 4px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #searchBox {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 8px;
    border-radius: 3px;
    font-size: 13px;
    width: 100%;
  }
  #searchBox:focus { outline: none; border-color: var(--accent); }

  .kana-index {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .kana-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
    text-align: center;
    line-height: 1;
    aspect-ratio: 1 / 1;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .kana-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .kana-btn:disabled { color: #444; border-color: #2a2a2a; cursor: default; }
  .kana-btn.active { border-color: var(--accent); color: var(--accent); background: #2a2a1a; }

  #recipeList { flex: 1; overflow-y: auto; list-style: none; }
  #recipeList li {
    padding: 9px 12px;
    cursor: pointer;
    border-bottom: 1px solid rgba(58, 58, 58, 0.4);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #recipeList li:hover { background: #2e2e2e; }
  #recipeList li.selected { background: #2a2a1a; color: var(--accent); }
  li.fav-item-row { background: #1e1e14; }
  li.fav-item-row:hover { background: #2a2a1a; }
  li.fav-item-row.selected { background: #2a2a1a; color: var(--accent); }
  .list-empty {
    color: var(--muted);
    font-size: 12px;
    padding: 8px 12px;
    cursor: default;
    border-bottom: 1px solid rgba(58,58,58,0.4);
  }
  li.tips-li {
    display: block;
    cursor: default;
    padding: 10px 14px;
    background: none;
  }
  li.tips-li:hover { background: none; }
  .tips-row-mobile {
    font-size: 13px;
    color: var(--muted);
    line-height: 2;
  }

  .panel-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .result-header {
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    flex-wrap: wrap;
  }
  .result-header label { font-size: 12px; color: var(--muted); }

  .count-control { display: flex; align-items: center; gap: 4px; }
  .count-btn {
    width: 26px; height: 26px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    border-radius: 3px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    padding: 0;
  }
  .count-btn:hover { border-color: var(--accent); color: var(--accent); }
  #countInput {
    width: 52px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 7px;
    border-radius: 3px;
    font-size: 13px;
    text-align: right;
  }
  #countInput:focus { outline: none; border-color: var(--accent); }
  #resultTitle { font-size: 13px; color: var(--accent); }

  #backBtn {
    display: none;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 4px;
    margin-right: 4px;
    white-space: nowrap;
  }
  #backBtn:hover { background: #2a2a1a; }

  #treeContainer { flex: 1; overflow: auto; padding: 10px 14px; }

  .tips-msg {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tips-row {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .tree-node { line-height: 1.8; }
  .tree-node .node-row {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .tree-node .node-row:hover { background: #2e2e2e; }
  .toggle { font-size: 11px; color: var(--muted); width: 12px; display: inline-block; text-align: center; flex-shrink: 0; }
  .node-name { font-size: 14px; }
  .node-qty { font-size: 13px; color: var(--accent); }

  .node-sub-info {
    display: flex;
    flex-direction: column;
    font-size: 11px;
    line-height: 1.5;
    flex-shrink: 0;
  }
  .node-sub-row {
    display: flex;
    align-items: baseline;
    gap: 2px;
  }
  .node-sub-num {
    color: var(--surplus);
    font-size: 11px;
    white-space: nowrap;
  }
  .node-sub-label {
    color: var(--muted);
    white-space: nowrap;
  }

  .badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: bold; flex-shrink: 0; }
  .badge-craft    { background: #3a2e10; color: var(--craft); }
  .badge-gather   { background: #102030; color: var(--gather); }
  .badge-hunt     { background: #301010; color: var(--hunt); }
  .badge-buy      { background: #201030; color: var(--buy); }
  .badge-exchange { background: #102020; color: #5bd5c8; }
  .node-children { padding-left: 20px; }
  .node-children.collapsed { display: none; }

  .or-divider {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 4px;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }
  .or-divider::before,
  .or-divider::after {
    content: '';
    flex: 1;
    border-top: 1px solid var(--border);
  }

  .pin-btn {
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    line-height: 1;
    user-select: none;
    background: none;
    border: none;
    padding: 0 2px;
  }
  .pin-btn:hover { transform: scale(1.2); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }
  .empty-msg { color: var(--muted); font-size: 13px; padding: 20px; }
  .error-msg { color: #d57b5b; font-size: 13px; padding: 20px; }
  .node-icon {
    width: 32px; height: 32px;
    vertical-align: middle;
    image-rendering: pixelated;
    flex-shrink: 0;
    border-radius: 5px;
    box-shadow: inset 0 0 5px 2px rgba(0,0,0,0.6);
  }
  .list-icon {
    width: 32px; height: 32px;
    flex-shrink: 0;
    image-rendering: pixelated;
    border-radius: 5px;
    box-shadow: inset 0 0 5px 2px rgba(0,0,0,0.6);
  }
  .list-name { overflow-wrap: break-word; word-break: break-all; white-space: normal; }

  .footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 4px;
    pointer-events: none;
    z-index: 100;
  }
  .footer a { color: var(--muted); text-decoration: none; pointer-events: all; }
  .footer a:hover { color: var(--accent); }

  #confirmOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #confirmOverlay.open { display: flex; }
  #confirmDialog {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 24px;
    max-width: 300px;
    width: 90%;
    text-align: center;
  }
  #confirmMsg {
    font-size: 14px;
    margin-bottom: 16px;
    line-height: 1.8;
    white-space: pre-line;
  }
  .confirm-btns { display: flex; gap: 10px; justify-content: center; }
  .confirm-btn {
    padding: 6px 20px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .confirm-btn.yes { border-color: var(--accent); color: var(--accent); }
  .confirm-btn.yes:hover { background: #2a2a1a; }
  .confirm-btn.no:hover { background: #2e2e2e; }

  @media (max-width: 600px) {
    header { padding: 8px 12px; }
    header h1 { font-size: 14px; }
    #popupBtn { display: none; }
    .main { flex-direction: column; height: calc(100vh - 45px); }
    .panel-left { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid var(--border); }
    .panel-right { flex: 1; }
    #backBtn { display: inline; }
    #recipeList li { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid rgba(58, 58, 58, 0.4); }
    #searchBox { padding: 7px 10px; font-size: 14px; }
    .node-name { font-size: 15px; }
    .node-qty  { font-size: 14px; }
    .tree-node { line-height: 2; }
    .count-btn { width: 32px; height: 32px; font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <h1>FF14 レシピ素材ツリー</h1>
  <span id="loadStatus">データ読み込み中...</span>
  <button id="popupBtn" onclick="openPopup()">⧉ 小窓で開く</button>
</header>

<div class="main">
  <div class="panel-left" id="panelLeft">
    <div class="panel-left-header">
      <input type="text" id="searchBox" placeholder="絞り込み..." oninput="onSearch()">
      <div class="kana-index" id="kanaIndex"></div>
    </div>
    <ul id="recipeList"></ul>
  </div>
  <div class="panel-right" id="panelRight">
    <div class="result-header">
      <button id="backBtn" onclick="showList()">◀ 戻る</button>
      <label>個数:</label>
      <div class="count-control">
        <button class="count-btn" onclick="changeCount(-1)">－</button>
        <input type="number" id="countInput" value="1" min="1" inputmode="numeric" oninput="renderTree()">
        <button class="count-btn" onclick="changeCount(1)">＋</button>
      </div>
      <span id="resultTitle"></span>
    </div>
    <div id="treeContainer">
      <div class="tips-msg" id="tipsMsg"></div>
    </div>
  </div>
</div>
<div class="footer">© SQUARE ENIX / Data by XIVAPI / X : <a href="https://x.com/og_ff14" target="_blank" rel="noopener">@og_ff14</a></div>

<div id="confirmOverlay">
  <div id="confirmDialog">
    <div id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn yes" id="confirmYes">はい</button>
      <button class="confirm-btn no" id="confirmNo">いいえ</button>
    </div>
  </div>
</div>

<script>
const DATA_FILE = './data/Item.json';
const TIPS_FILE = './data/tips.json';
const isMobile = () => window.innerWidth <= 600;
const LS_FAV = 'ff14_favorites';

const CRAFT_TYPE_NAME = {
  '0': '木工師', '1': '鍛冶師', '2': '甲冑師', '3': '彫金師',
  '4': '革細工師', '5': '裁縫師', '6': '錬金術師', '7': '調理師',
  '8': '交換'
};
const CRAFT_JOBS_SET = new Set(['木工師','鍛冶師','甲冑師','彫金師','革細工師','裁縫師','錬金術師','調理師']);

const KANA_GROUPS = [
  { label: 'あ', chars: ['あ','い','う','え','お'] },
  { label: 'か', chars: ['か','き','く','け','こ','が','ぎ','ぐ','げ','ご'] },
  { label: 'さ', chars: ['さ','し','す','せ','そ','ざ','じ','ず','ぜ','ぞ'] },
  { label: 'た', chars: ['た','ち','つ','て','と','だ','ぢ','づ','で','ど'] },
  { label: 'な', chars: ['な','に','ぬ','ね','の'] },
  { label: '英', chars: null },
  { label: 'は', chars: ['は','ひ','ふ','へ','ほ','ば','び','ぶ','べ','ぼ','ぱ','ぴ','ぷ','ぺ','ぽ'] },
  { label: 'ま', chars: ['ま','み','む','め','も'] },
  { label: 'や', chars: ['や','ゆ','よ'] },
  { label: 'ら', chars: ['ら','り','る','れ','ろ'] },
  { label: 'わ', chars: ['わ','を','ん'] },
];

let itemMaster = {};
let recipes = {};
let recipeNames = [];
let selectedRecipe = null;
let favorites = new Set();
let tipsData = [];

let listMode = 'none';
let activeKanaGroup = null;
let activeKanaBtn = null;

const iconCache = new Map();
function iconPath(iconUrl) {
  if (!iconUrl) return '';
  if (iconCache.has(iconUrl)) return iconCache.get(iconUrl);
  const parts = iconUrl.split('/');
  const result = './picture/' + parts[parts.length - 1];
  iconCache.set(iconUrl, result);
  return result;
}

function isEnglishFirst(name) { return /^[A-Za-z]/.test(name); }

function sortRecipeNames(names) {
  const ja = names.filter(n => !isEnglishFirst(n));
  const en = names.filter(n => isEnglishFirst(n));
  ja.sort((a, b) => a.localeCompare(b, 'ja'));
  en.sort((a, b) => a.localeCompare(b, 'en'));
  return [...ja, ...en];
}

function loadFavorites() {
  try {
    const raw = localStorage.getItem(LS_FAV);
    if (raw) favorites = new Set(JSON.parse(raw));
  } catch(e) { favorites = new Set(); }
}

function saveFavorites() {
  localStorage.setItem(LS_FAV, JSON.stringify([...favorites]));
}

function showConfirm(msg, onYes) {
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmOverlay').classList.add('open');
  const close = () => document.getElementById('confirmOverlay').classList.remove('open');
  document.getElementById('confirmYes').onclick = () => { close(); onYes(); };
  document.getElementById('confirmNo').onclick = close;
}

function pinOn(name) {
  favorites.add(name);
  saveFavorites();
  refreshPins(name);
  if (listMode === 'fav') renderList();
}

function pinOff(name) {
  showConfirm(`「${name}」を\nお気に入りから削除しますか？`, () => {
    favorites.delete(name);
    saveFavorites();
    refreshPins(name);
    if (listMode === 'fav') renderList();
  });
}

const treePinMap = new Map();

function registerTreePin(name, btn) {
  if (!treePinMap.has(name)) treePinMap.set(name, new Set());
  treePinMap.get(name).add(btn);
}

function refreshPins(name) {
  const isOn = favorites.has(name);
  treePinMap.get(name)?.forEach(btn => {
    btn.textContent = isOn ? '📌' : '📍';
    btn.style.filter = isOn ? 'none' : 'grayscale(1) opacity(0.4)';
    btn.title = isOn ? 'お気に入りから削除' : 'お気に入りに追加';
  });
}

function clearKanaActive() {
  if (activeKanaBtn) {
    activeKanaBtn.classList.remove('active');
    activeKanaBtn = null;
  }
  activeKanaGroup = null;
}

function onKana(group, btn) {
  clearKanaActive();
  document.getElementById('searchBox').value = '';
  document.getElementById('favKanaBtn')?.classList.remove('active');
  activeKanaGroup = group;
  activeKanaBtn = btn;
  btn.classList.add('active');
  listMode = 'kana';
  renderList();
}

function onSearch() {
  const q = document.getElementById('searchBox').value.trim();
  clearKanaActive();
  document.getElementById('favKanaBtn')?.classList.remove('active');
  listMode = q === '' ? 'none' : 'search';
  renderList();
}

function toggleFav() {
  const btn = document.getElementById('favKanaBtn');
  clearKanaActive();
  document.getElementById('searchBox').value = '';
  listMode = 'fav';
  btn.classList.add('active');
  renderList();
}

function getDisplayList() {
  switch (listMode) {
    case 'kana':
      return activeKanaGroup
        ? recipeNames.filter(n => matchKanaGroup(n, activeKanaGroup))
        : [];
    case 'search': {
      const q = document.getElementById('searchBox').value.trim();
      return q ? recipeNames.filter(n => n.includes(q)) : [];
    }
    case 'fav':
      return [...favorites].filter(n => recipes[n]);
    default:
      return [];
  }
}

function renderTips() {
  const msg = document.getElementById('tipsMsg');
  if (!msg) return;
  msg.innerHTML = '';
  tipsData.forEach(text => {
    const row = document.createElement('div');
    row.className = 'tips-row';
    row.textContent = text;
    msg.appendChild(row);
  });
}

function renderList() {
  const ul = document.getElementById('recipeList');
  const frag = document.createDocumentFragment();
  const names = getDisplayList();

  if (isMobile() && listMode === 'none') {
    const li = document.createElement('li');
    li.className = 'tips-li';
    tipsData.forEach(text => {
      const row = document.createElement('div');
      row.className = 'tips-row-mobile';
      row.textContent = text;
      li.appendChild(row);
    });
    frag.appendChild(li);
    ul.innerHTML = '';
    ul.appendChild(frag);
    return;
  }

  if (listMode === 'fav' && favorites.size === 0) {
    const li = document.createElement('li');
    li.className = 'list-empty';
    li.textContent = 'お気に入りはありません';
    frag.appendChild(li);
  } else if (names.length === 0 && listMode !== 'none') {
    const li = document.createElement('li');
    li.className = 'list-empty';
    li.textContent = '該当するレシピがありません';
    frag.appendChild(li);
  } else {
    names.forEach(name => {
      frag.appendChild(listMode === 'fav' ? makeFavLi(name) : makeRecipeLi(name));
    });
  }

  ul.innerHTML = '';
  ul.appendChild(frag);
}

function makeFavLi(name) {
  const master = itemMaster[name] || {};
  const li = document.createElement('li');
  li.className = 'fav-item-row' + (selectedRecipe === name ? ' selected' : '');
  li.title = name;

  if (master.icon) {
    const img = document.createElement('img');
    img.src = master.icon;
    img.className = 'list-icon';
    img.alt = '';
    img.onerror = () => { img.style.display = 'none'; };
    li.appendChild(img);
  }

  const pin = document.createElement('button');
  pin.className = 'pin-btn';
  pin.textContent = '📌';
  pin.title = 'お気に入りから削除';
  pin.style.filter = 'none';
  pin.onclick = e => { e.stopPropagation(); pinOff(name); };
  li.appendChild(pin);

  const span = document.createElement('span');
  span.className = 'list-name';
  span.textContent = name;
  li.appendChild(span);

  li.onclick = () => selectRecipeByName(name);
  return li;
}

function makeRecipeLi(name) {
  const master = itemMaster[name] || {};
  const li = document.createElement('li');
  li.title = name;
  if (selectedRecipe === name) li.classList.add('selected');

  if (master.icon) {
    const img = document.createElement('img');
    img.src = master.icon;
    img.className = 'list-icon';
    img.alt = '';
    img.onerror = () => { img.style.display = 'none'; };
    li.appendChild(img);
  }

  const span = document.createElement('span');
  span.className = 'list-name';
  span.textContent = name;
  li.appendChild(span);

  li.onclick = () => selectRecipe(name, li);
  return li;
}

function selectRecipe(name, li) {
  selectedRecipe = name;
  document.querySelectorAll('#recipeList li').forEach(el => el.classList.remove('selected'));
  li.classList.add('selected');
  renderTree();
  if (isMobile()) {
    showTree();
    document.getElementById('treeContainer').scrollTop = 0;
  }
}

function selectRecipeByName(name) {
  selectedRecipe = name;
  renderList();
  renderTree();
  if (isMobile()) {
    showTree();
    document.getElementById('treeContainer').scrollTop = 0;
  }
}

async function init() {
  loadFavorites();

  try {
    tipsData = await fetch(TIPS_FILE).then(r => r.ok ? r.json() : []);
  } catch(e) {
    tipsData = ['📌 ピンでお気に入り登録', 'あ〜英 で行絞り込み', '検索欄でアイテム名検索'];
  }

  if (!isMobile()) renderTips();

  try {
    const rawList = await fetch(DATA_FILE).then(r => {
      if (!r.ok) throw new Error(`Item.json が見つかりません (${r.status})`);
      return r.json();
    });

    const idToItem = {};
    let maxPatch = 0;

    rawList.forEach(item => { idToItem[item.ID] = item; });

    rawList.forEach(item => {
      const r = item.Recipe;
      const name = item.Name;

      if (r?.PatchNumber) {
        const p = parseInt(r.PatchNumber, 10);
        if (p > maxPatch) maxPatch = p;
      }

      if (r && r.CraftType !== undefined) {
        const jobName = CRAFT_TYPE_NAME[r.CraftType] || 'クラフト';
        itemMaster[name] = { method: jobName, icon: iconPath(item.IconUrl), craftType: String(r.CraftType) };
        recipes[name] = {
          yield: parseInt(r.AmountResult, 10) || 1,
          craftType: String(r.CraftType),
          ingredients: r.Ingredients.map(ing => ({
            name: ing.Name,
            qty: parseInt(ing.Amount, 10) || 1,
            itemId: ing.ItemID
          }))
        };
      } else {
        if (!itemMaster[name]) {
          itemMaster[name] = { method: '', icon: iconPath(item.IconUrl), craftType: '' };
        }
      }
    });

    rawList.forEach(item => {
      if (!item.Recipe?.Ingredients) return;
      item.Recipe.Ingredients.forEach(ing => {
        if (!itemMaster[ing.Name]) {
          const ref = idToItem[ing.ItemID];
          itemMaster[ing.Name] = { method: '', icon: ref ? iconPath(ref.IconUrl) : '', craftType: '' };
        }
      });
    });

    recipeNames = sortRecipeNames(Object.keys(recipes));

    const kanaGroupSet = new Set();
    recipeNames.forEach(name => {
      KANA_GROUPS.forEach(group => {
        if (!kanaGroupSet.has(group.label) && matchKanaGroup(name, group)) {
          kanaGroupSet.add(group.label);
        }
      });
    });

    const patchStr = maxPatch > 0
      ? ` / patch ${String(maxPatch).slice(0, -2)}.${String(maxPatch).slice(-2)} 対応`
      : '';
    document.getElementById('loadStatus').textContent =
      `${recipeNames.length}レシピ 読み込み済み${patchStr}`;

    buildKanaIndex(kanaGroupSet);
    renderList();

    if (isMobile()) showList();

  } catch (e) {
    document.getElementById('loadStatus').textContent = '読み込みエラー';
    document.getElementById('treeContainer').innerHTML =
      `<div class="error-msg">データの読み込みに失敗しました。<br>${e.message}</div>`;
  }
}

function buildKanaIndex(kanaGroupSet) {
  const container = document.getElementById('kanaIndex');
  const frag = document.createDocumentFragment();

  KANA_GROUPS.forEach(group => {
    const btn = document.createElement('button');
    btn.className = 'kana-btn';
    btn.textContent = group.label;
    if (!kanaGroupSet.has(group.label)) {
      btn.disabled = true;
    } else {
      btn.onclick = () => onKana(group, btn);
    }
    frag.appendChild(btn);
  });

  const favBtn = document.createElement('button');
  favBtn.className = 'kana-btn';
  favBtn.id = 'favKanaBtn';
  favBtn.textContent = '📌';
  favBtn.title = 'お気に入り';
  favBtn.onclick = toggleFav;
  frag.appendChild(favBtn);

  container.innerHTML = '';
  container.appendChild(frag);
}

function matchKanaGroup(name, group) {
  if (!name) return false;
  const first = name[0];
  if (group.chars === null) return isEnglishFirst(name);
  return group.chars.some(c => {
    const kata = String.fromCharCode(c.charCodeAt(0) + 0x60);
    return first === c || first === kata;
  });
}

function showList() {
  if (!isMobile()) return;
  document.getElementById('panelLeft').style.display = 'flex';
  document.getElementById('panelRight').style.display = 'none';
}

function showTree() {
  if (!isMobile()) return;
  document.getElementById('panelLeft').style.display = 'none';
  document.getElementById('panelRight').style.display = 'flex';
}

function changeCount(delta) {
  const input = document.getElementById('countInput');
  input.value = Math.max(1, (parseInt(input.value, 10) || 1) + delta);
  renderTree();
}

function renderTree() {
  const container = document.getElementById('treeContainer');
  const tips = document.getElementById('tipsMsg');
  if (tips) tips.remove();

  const count = parseInt(document.getElementById('countInput').value, 10) || 1;
  if (!selectedRecipe) return;
  document.getElementById('resultTitle').textContent = `【${selectedRecipe} × ${count}個分】`;
  treePinMap.clear();
  const producedQty = calcProduced(selectedRecipe, count);
  container.innerHTML = '';
  container.appendChild(buildNode(selectedRecipe, count, producedQty, 0));
}

function calcProduced(name, needed) {
  const r = recipes[name];
  if (!r) return needed;
  return r.yield * Math.ceil(needed / r.yield);
}

function buildNode(name, neededQty, producedQty, depth) {
  const master = itemMaster[name] || { method: '', icon: '', craftType: '' };
  const surplus = producedQty - neededQty;
  const hasChildren = !!recipes[name];
  const isExchange = hasChildren && recipes[name].craftType === '8';

  const div = document.createElement('div');
  div.className = 'tree-node';

  const row = document.createElement('div');
  row.className = 'node-row';

  const toggle = document.createElement('span');
  toggle.className = 'toggle';
  toggle.textContent = hasChildren ? '▼' : ' ';

  const badge = document.createElement('span');
  badge.className = 'badge ' + methodBadgeClass(master.method);
  badge.textContent = master.method;
  if (!master.method) badge.style.display = 'none';

  const iconEl = document.createElement('img');
  iconEl.className = 'node-icon';
  iconEl.alt = '';
  if (master.icon) {
    iconEl.src = master.icon;
    iconEl.onerror = () => { iconEl.style.display = 'none'; };
  } else {
    iconEl.style.display = 'none';
  }

  row.append(toggle, badge, iconEl);

  if (hasChildren) {
    const pin = document.createElement('button');
    pin.className = 'pin-btn';
    const isOn = favorites.has(name);
    pin.textContent = isOn ? '📌' : '📍';
    pin.style.filter = isOn ? 'none' : 'grayscale(1) opacity(0.4)';
    pin.title = isOn ? 'お気に入りから削除' : 'お気に入りに追加';
    pin.onclick = e => {
      e.stopPropagation();
      favorites.has(name) ? pinOff(name) : pinOn(name);
    };
    registerTreePin(name, pin);
    row.appendChild(pin);
  }

  const nameEl = document.createElement('span');
  nameEl.className = 'node-name';
  nameEl.textContent = name;

  const qtyEl = document.createElement('span');
  qtyEl.className = 'node-qty';
  qtyEl.textContent = `× ${producedQty}`;

  row.append(nameEl, qtyEl);

  // 余剰・制作回数
  const hasSurplus = surplus > 0;
  const times = hasChildren ? Math.ceil(neededQty / recipes[name].yield) : 0;
  const hasCraft = times >= 2;

  if (hasSurplus || hasCraft) {
    const subInfo = document.createElement('span');
    subInfo.className = 'node-sub-info';

    if (hasSurplus) {
      const subRow = document.createElement('span');
      subRow.className = 'node-sub-row';
      const pre = document.createElement('span');
      pre.className = 'node-sub-label';
      pre.textContent = '(↩';
      const num = document.createElement('span');
      num.className = 'node-sub-num';
      num.textContent = ` ${surplus} `;
      const suf = document.createElement('span');
      suf.className = 'node-sub-label';
      suf.textContent = '個余り)';
      subRow.append(pre, num, suf);
      subInfo.appendChild(subRow);
    }

    if (hasCraft) {
      const subRow = document.createElement('span');
      subRow.className = 'node-sub-row';
      const pre = document.createElement('span');
      pre.className = 'node-sub-label';
      pre.textContent = '(🔨';
      const num = document.createElement('span');
      num.className = 'node-sub-num';
      num.textContent = ` ${times} `;
      const suf = document.createElement('span');
      suf.className = 'node-sub-label';
      suf.textContent = '回制作)';
      subRow.append(pre, num, suf);
      subInfo.appendChild(subRow);
    }

    row.appendChild(subInfo);
  }

  div.appendChild(row);

  if (hasChildren) {
    const children = document.createElement('div');
    children.className = 'node-children';
    const r = recipes[name];

    if (isExchange) {
      r.ingredients.forEach((ing, idx) => {
        if (idx > 0) {
          const orDiv = document.createElement('div');
          orDiv.className = 'or-divider';
          orDiv.textContent = 'もしくは';
          children.appendChild(orDiv);
        }
        const subNeeded = ing.qty * Math.ceil(producedQty / r.yield);
        const subProduced = calcProduced(ing.name, subNeeded);
        children.appendChild(buildNode(ing.name, subNeeded, subProduced, depth + 1));
      });
    } else {
      r.ingredients.forEach(ing => {
        const subNeeded = ing.qty * Math.ceil(producedQty / r.yield);
        const subProduced = calcProduced(ing.name, subNeeded);
        children.appendChild(buildNode(ing.name, subNeeded, subProduced, depth + 1));
      });
    }

    div.appendChild(children);
    row.onclick = () => {
      const collapsed = children.classList.toggle('collapsed');
      toggle.textContent = collapsed ? '▶' : '▼';
    };
  }

  return div;
}

function methodBadgeClass(method) {
  if (!method) return 'badge-gather';
  if (CRAFT_JOBS_SET.has(method)) return 'badge-craft';
  if (method === '交換') return 'badge-exchange';
  return 'badge-gather';
}

function openPopup() {
  const w = 601;
  const ROW_H = 34;
  const HEADER_H = 90;
  const rows = Math.min(recipeNames.length, 12);
  const h = HEADER_H + rows * ROW_H;
  const left = Math.round((screen.width - w) / 2);
  const top  = Math.round((screen.height - h) / 2);
  const win = window.open(
    location.pathname, 'ff14recipe',
    `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no`
  );
  if (!win) alert('ポップアップがブロックされました。\nアドレスバーの通知から許可してください。');
}

init();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then(reg => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'activated') {
            console.log('[SW] 新しいバージョンに更新されました');
          }
        });
      });
    })
    .catch(err => console.warn('[SW] 登録失敗:', err));
}
</script>
</body>
</html>
