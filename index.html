<h1>XIVca は移転しました</h1>
<p>新しいサイトは <a href="https://xivca.com/">https://xivca.com/</a> です。リンクを押して移動してください。</p>
<p>ブックマークは新しいアドレスに変更してください。</p>
<h2>インストールしたアプリ（PWA）について</h2>
<p>以前のPWAは、新しいサイトのPWAとして作り直してください。新しいサイトをブラウザーで開き、「ホーム画面に追加」または「アプリとしてインストール」を選びます。</p>
<p>保存データはドメインごとに管理され、新しいサイトへ自動では引き継がれません。旧PWAを削除する前に、必要な保存データの書き出しと移行先での取り込みを済ませてください。</p>
