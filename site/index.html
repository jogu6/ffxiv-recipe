<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#252525">
<title>FF14 レシピ素材ツリー</title>
<link rel="icon" href="./assets/app-icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="./assets/app-icons/favicon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header>
  <div class="header-primary-row">
    <div class="app-title" id="appTitle" role="button" tabindex="0" title="初期画面に戻る">
      <img class="app-title-icon" src="./assets/app-icons/favicon.png" alt="">
      <h1>FF14 レシピ素材ツリー</h1>
    </div>
    <span id="appVersion"></span>
    <span id="loadStatus">データ読み込み中...</span>
  </div>
  <button id="popupBtn">⧉ 小窓で開く</button>
  <button id="mobileBackBtn" type="button">◀ 戻る</button>
  <button id="settingsBtn">⚙ 設定</button>
</header>

<div class="main">
  <div class="panel-left" id="panelLeft">
    <div class="panel-left-header">
      <div class="search-wrap">
        <input type="text" id="searchBox" placeholder="絞り込み...">
        <button id="searchClearBtn" type="button" title="検索をクリア" aria-label="検索をクリア">×</button>
      </div>
      <ul id="searchHistory"></ul>
      <button id="favBtn" title="お気に入り">📌 お気に入り</button>
      <ul id="favoriteLists"></ul>
    </div>
    <ul id="recipeList"></ul>
    <div class="tips-msg mobile-tips-msg hidden" id="mobileTipsMsg"></div>
  </div>
  <div class="panel-middle" id="panelMiddle">
    <div class="panel-middle-header">
      <button id="usesBackBtn">◀ 戻る</button>
      <span id="usesTitle"></span>
    </div>
    <ul id="usesList"></ul>
  </div>
  <div class="panel-right" id="panelRight">
    <div class="result-header">
      <div class="result-main-row">
        <span id="resultTitle"></span>
        <button id="backBtn">◀ 戻る</button>
        <label id="countLabel">個数:</label>
        <div class="count-control">
          <button class="count-btn count-step-wide" id="countDecrease5Btn">-5</button>
          <button class="count-btn" id="countDecreaseBtn">－</button>
          <input type="number" id="countInput" value="1" min="1" max="999" step="1" inputmode="numeric">
          <button class="count-btn" id="countIncreaseBtn">＋</button>
          <button class="count-btn count-step-wide" id="countIncrease5Btn">+5</button>
        </div>
      </div>
      <div class="result-view-row">
        <div id="resultViewSwitch" class="result-view-switch hidden" role="group" aria-label="表示切替">
          <button id="treeViewBtn" class="active" type="button">🌲 レシピツリー</button>
          <button id="materialsViewBtn" type="button">素材リスト</button>
        </div>
        <button id="usesBtn">使用先</button>
      </div>
    </div>
    <div id="treeContainer">
      <div class="tips-msg" id="tipsMsg"></div>
    </div>
  </div>
</div>
<div class="footer">© SQUARE ENIX / Data by XIVAPI / X : <a href="https://x.com/og_ff14" target="_blank" rel="noopener">@og_ff14</a></div>
<div id="updateNotice" role="status">
  <span>アプリが更新されました</span>
  <button id="updateReloadBtn" type="button">再読み込み</button>
</div>

<div id="confirmOverlay">
  <div id="confirmDialog">
    <div id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn yes" id="confirmYes">はい</button>
      <button class="confirm-btn no" id="confirmNo">いいえ</button>
    </div>
  </div>
</div>

<div id="settingsOverlay">
  <div id="settingsDialog">
    <div class="settings-top-actions">
      <button class="settings-corner-btn" id="contactBtn" type="button" title="報告・お問い合わせ">
        <span>報告・お問い合わせ</span>
        <svg class="discord-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.4 4.9A16.1 16.1 0 0 0 15.5 3l-.2.4c1.4.3 2.1.8 2.1.8a13.7 13.7 0 0 0-10.8 0s.7-.5 2.2-.8L8.5 3a16.1 16.1 0 0 0-3.9 1.9C2.2 8.5 1.6 12 1.9 15.4c1.6 1.2 3.1 1.9 4.6 2.3l.9-1.5c-.5-.2-1-.4-1.5-.7l.4-.3c2.9 1.4 6 1.4 8.8 0l.4.3c-.5.3-1 .5-1.5.7l.9 1.5c1.5-.4 3.1-1.1 4.6-2.3.4-4-.6-7.5-2.1-10.5ZM8.8 13.4c-.8 0-1.5-.8-1.5-1.8s.7-1.8 1.5-1.8 1.5.8 1.5 1.8-.7 1.8-1.5 1.8Zm6.4 0c-.8 0-1.5-.8-1.5-1.8s.7-1.8 1.5-1.8 1.5.8 1.5 1.8-.7 1.8-1.5 1.8Z"/>
        </svg>
      </button>
      <button class="settings-corner-btn" id="privacyBtn" type="button">プライバシー</button>
      <button class="settings-corner-btn" id="licenseBtn" type="button">LICENSE</button>
    </div>
    <h2>⚙ 設定</h2>
    <div class="settings-section">
      <div class="settings-label">シェアするお気に入りリストを選ぶ</div>
      <div class="settings-dropdown">
        <button id="exportListToggle" class="settings-dropdown-toggle" type="button">リストを選択...</button>
        <ul id="exportListChoices" class="settings-dropdown-list"></ul>
      </div>
      <div class="settings-row">
        <input id="exportCode" class="settings-input" type="text" readonly>
        <button class="settings-btn" id="copyExportBtn">コピー</button>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-label">シェアされたお気に入りを取り込む</div>
      <div class="settings-row">
        <input id="importCode" class="settings-input" type="text" placeholder="コードを貼り付け...">
        <button class="settings-btn" id="startImportBtn">取り込む</button>
      </div>
      <div id="importErr" class="settings-err"></div>
    </div>
    <div class="settings-close">
      <button class="confirm-btn no" id="settingsCloseBtn">閉じる</button>
    </div>
  </div>
</div>

<div id="licenseOverlay">
  <div id="licenseDialog">
    <h2 id="licenseTitle">LICENSE / NOTICE</h2>
    <div id="licenseText" class="document-text"></div>
    <div class="settings-close">
      <button class="confirm-btn no" id="licenseCloseBtn">閉じる</button>
    </div>
  </div>
</div>

<div id="textInputOverlay">
  <div id="textInputDialog">
    <div id="textInputMsg"></div>
    <input id="textInputField" class="settings-input" type="text" maxlength="50">
    <div class="choice-btns">
      <button class="choice-btn" id="textInputOkBtn">OK</button>
      <button class="choice-btn" id="textInputCancelBtn">キャンセル</button>
    </div>
  </div>
</div>

<div id="favoriteTargetOverlay">
  <div id="favoriteTargetDialog">
    <div id="favoriteTargetMsg"></div>
    <div id="favoriteTargetCreate"></div>
    <div id="favoriteTargetChoices" class="choice-list"></div>
    <div class="choice-btns">
      <button class="choice-btn" id="favoriteTargetCancelBtn">キャンセル</button>
    </div>
  </div>
</div>

<div id="materialTreeOverlay">
  <div id="materialTreeDialog">
    <div class="material-tree-dialog-header">
      <span id="materialTreeTitle"></span>
      <div class="material-tree-count-row">
        <label for="materialTreeCountInput">個数:</label>
        <div class="count-control">
          <button class="count-btn count-step-wide" id="materialTreeDecrease5Btn" type="button">-5</button>
          <button class="count-btn" id="materialTreeDecreaseBtn" type="button">－</button>
          <input type="number" id="materialTreeCountInput" value="1" min="1" max="999" step="1" inputmode="numeric">
          <button class="count-btn" id="materialTreeIncreaseBtn" type="button">＋</button>
          <button class="count-btn count-step-wide" id="materialTreeIncrease5Btn" type="button">+5</button>
        </div>
      </div>
    </div>
    <div id="materialTreeContent"></div>
    <div class="settings-close">
      <button class="confirm-btn no" id="materialTreeCloseBtn" type="button">閉じる</button>
    </div>
  </div>
</div>

<script src="./calculation.js"></script>
<script src="./app.js"></script>
<!-- Cloudflare Web Analytics -->
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "decd66c3481c4277a749a59964c307a6"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
