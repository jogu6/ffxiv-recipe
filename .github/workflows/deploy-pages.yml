name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'macro-app/**'
      - '.github/workflows/deploy-pages.yml'
      - 'tools/prepare-macro-engines.mjs'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  runtime-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Prepare unchanged published engines
        id: engines
        run: node tools/prepare-macro-engines.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@master
        if: steps.engines.outputs.build == 'true'
        with:
          toolchain: nightly-2026-05-10
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
        if: steps.engines.outputs.build == 'true'
      - name: Build changed macro engines
        if: steps.engines.outputs.build == 'true'
        run: npm run build:wasm --prefix macro-app
      - name: Stage macro runtime
        run: npm run stage:site --prefix macro-app
      - name: Verify one startup, parallel search, and allocation recovery
        run: npm run test:e2e -- tests/app-startup-progress.spec.js tests/macro-parallel-storage.spec.js --project chromium
  deploy:
    needs: runtime-regression
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare unchanged published engines
        id: engines
        run: node tools/prepare-macro-engines.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@master
        if: steps.engines.outputs.build == 'true'
        with:
          toolchain: nightly-2026-05-10
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
        if: steps.engines.outputs.build == 'true'
      - name: Build changed macro engine
        if: steps.engines.outputs.build == 'true'
        run: npm run build:wasm --prefix macro-app
      - name: Stage isolated macro application
        run: npm run stage:site --prefix macro-app
      - name: Update application cache for built assets
        run: npm run cache:app
      - name: Validate built site assets
        run: node tools/validate-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
